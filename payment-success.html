<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Tasmafive Solutions</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .success-container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: bounceIn 0.6s ease-out;
        }
        
        .success-icon i {
            color: white;
            font-size: 36px;
        }
        
        .success-title {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 16px;
        }
        
        .success-message {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .success-details {
            background: #f8fafc;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 40px;
            text-align: left;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-size: 14px;
            color: #64748b;
        }
        
        .detail-value {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
        }
        
        .action-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        
        .btn {
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: #0f172a;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: white;
            color: #0f172a;
            border: 2px solid #e2e8f0;
        }
        
        .btn-secondary:hover {
            border-color: #0f172a;
        }
        
        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            50% {
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .success-container {
                padding: 40px 24px;
            }
            
            .success-title {
                font-size: 28px;
            }
            
            .success-message {
                font-size: 16px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        
        <h1 class="success-title">Payment Successful!</h1>
        <p class="success-message">
            Thank you for your payment. Your transaction has been processed successfully and you will receive a confirmation email shortly.
        </p>
        
        <div class="success-details">
            <div class="detail-row">
                <span class="detail-label">Transaction ID</span>
                <span class="detail-value" id="transactionId">Processing...</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount</span>
                <span class="detail-value" id="amount">Processing...</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Payment Method</span>
                <span class="detail-value">Razorpay</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value" style="color: #10b981;">Completed</span>
            </div>
        </div>
        
        <div class="action-buttons">
            <a href="/" class="btn btn-primary">
                <i class="fa-solid fa-home"></i>
                Back to Home
            </a>
            <a href="https://wa.me/916307558730" class="btn btn-secondary" target="_blank">
                <i class="fa-brands fa-whatsapp"></i>
                Contact Support
            </a>
        </div>
    </div>
    
    <script>
        // Get transaction details from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const reference = urlParams.get('reference');
        const amount = urlParams.get('amount');
        
        if (reference) {
            document.getElementById('transactionId').textContent = reference;
        }
        
        if (amount) {
            document.getElementById('amount').textContent = '₹' + parseFloat(amount).toLocaleString('en-IN');
        }
        
        // Auto redirect to home after 30 seconds
        setTimeout(() => {
            if (confirm('Would you like to return to the home page?')) {
                window.location.href = '/';
            }
        }, 30000);
    </script>
</body>
</html>
